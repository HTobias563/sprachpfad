<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>UI-Test</title><link rel="stylesheet" href="../styles/app.css"></head><body>
<div id="app"></div><pre id="log" style="position:absolute;left:0;top:0"></pre>
<script>window.__errors=[];window.onerror=function(m,s,l){window.__errors.push(m+' @'+(s||'')+':'+l)};window.addEventListener('unhandledrejection',e=>window.__errors.push('rejection '+(e.reason&&e.reason.message||e.reason)));</script>
<script type="module">
import '../src/main.js';
const log=[]; const L=m=>log.push(m);
const q=s=>document.querySelector(s), qa=s=>Array.from(document.querySelectorAll(s));
const out=()=>{ document.getElementById('log').textContent=log.join('\n'); };
const state=()=>window.__app.store.get();
const route=()=>window.__app.router.current();
function runSteps(max, label){
  let steps=0, types={};
  while(steps<max){
    steps++;
    if(!q('.sess')) return {steps,types,end:q('.done')?'done':'nosession:'+route()};
    const title=q('.qtitle')?q('.qtitle').textContent.replace(/\d+ von 6: .*/,'N von 6'):'?'; types[title]=(types[title]||0)+1;
    if(q('#ex-bottom [data-act="next"]')) q('#ex-bottom [data-act="next"]').click();
    else if(q('[data-act="skip"]')) q('[data-act="skip"]').click();
    else if(q('[data-act="pair"]:not([disabled])')) { const l=q('[data-act="pair"][data-side="l"]:not([disabled])'); l.click(); const r=q('[data-act="pair"][data-side="r"][data-id="'+l.dataset.id+'"]'); if(steps%4===0){ const wrong=qa('[data-act="pair"][data-side="r"]:not([disabled])').find(b=>b.dataset.id!==l.dataset.id); (wrong||r).click(); } else r.click(); }
    else if(q('[data-act="tile"]')) { const free=qa('[data-act="tile"]:not(.used)'); const chk=q('[data-act="check"]:not([disabled])'); if(free.length && (!chk || steps%3)) free[0].click(); else chk.click(); }
    else if(q('[data-act="opt"]')) { const chk=q('[data-act="check"]:not([disabled])'); if(!chk){ const o=qa('[data-act="opt"]'); o[Math.floor(Math.random()*o.length)].click(); } else chk.click(); }
    else return {steps,types,end:'STUCK on '+title};
  }
  return {steps,types,end:'ABORT'};
}
function finishSession(label){
  const r=runSteps(900,label); L('  '+r.end+' steps='+r.steps+' types='+JSON.stringify(r.types));
  if(r.end==='done'){ L('  done: '+q('.done h2').textContent+' due-btn='+!!q('[data-act="again"]')+' miles='+qa('.mile').length); q('[data-act="home"]').click(); }
  return r;
}
function runSession(sel, label){
  const b=q(sel); if(!b){ L(label+': START BUTTON MISSING ('+sel+') route='+route()); return; }
  L(label+': '+b.textContent.trim().replace(/\s+/g,' ').slice(0,50)); b.click();
  try { finishSession(label); } catch(e){ L('  EXCEPTION '+e.message+' '+(e.stack||'').split('\n')[1]); }
}
const tab=t=>{ q('[data-act="tab"][data-tab="'+t+'"]').click(); };
try {
  L('start route='+route());
  // Onboarding
  q('[data-act="pick-lang"][data-code="vi"]').click(); q('[data-act="next"]').click(); L('onb step goal='+!!q('[data-act="set-goal"]'));
  q('[data-act="set-goal"][data-n="1"]').click(); q('[data-act="next"]').click(); L('onb step voice='+!!q('[data-act="test-voice"]'));
  q('[data-act="finish"]').click(); L('after onboarding route='+route()+' goal='+state().settings.goal+' done='+state().onboardingDone);
  finishSession('first lesson');
  L('home route='+route()+' chip='+!!q('[data-act="lang-sheet"]'));
  runSession('[data-act="start-lesson"][data-id="u1l1"]', 'lesson2');
  runSession('[data-act="start-lesson"][data-id="u1l1"]', 'lesson2 repeat');
  // Abbruch
  q('[data-act="start-lesson"][data-id="u1l2"]').click(); runSteps(8,'quit'); const itemsBefore=Object.keys(state().langs.vi.items).length; const xpBefore=state().days['2026-09-20']?state().days['2026-09-20'].xp:0;
  q('[data-act="quit"]').click(); const sheetQuit=q('.overlay [data-act="quit"]'); L('quit sheet='+!!sheetQuit); if(sheetQuit) sheetQuit.click();
  L('after quit route='+route()+' pending='+(state().pending?'yes':'no')+' items '+itemsBefore+'→'+Object.keys(state().langs.vi.items).length+' xp '+xpBefore+'→'+(state().days['2026-09-20']||{}).xp);
  // Fortsetzen
  q('[data-act="start-lesson"][data-id="u1l3"]').click(); runSteps(5,'resume'); const idxBefore=state().pending?state().pending.idx:-1;
  window.__app.boot();
  const resumeBtn=q('.overlay [data-act="resume"]'); L('resume sheet='+!!resumeBtn+' idx='+idxBefore);
  if(resumeBtn){ resumeBtn.click(); L('  resumed route='+route()+' idx='+(window.__app.ctx.session?window.__app.ctx.session.idx:'-')); finishSession('resume'); }
  // Wiederholen erzwingen
  window.__app.store.update(s=>{ Object.values(s.langs.vi.items).forEach(i=>i.due='2000-01-01'); }); window.__app.router.render();
  runSession('[data-act="start-review"]', 'review');
  // Üben
  tab('practice'); L('practice cards='+qa('.pcard').length);
  runSession('[data-act="quick"]', 'quick'); tab('practice'); runSession('[data-act="listen"]', 'listen'); tab('practice'); runSession('[data-act="drill"]', 'drill');
  // Reise
  tab('travel'); L('travel rows='+qa('.prow').length);
  const inp=q('[data-input="search"]'); inp.value='toilette'; inp.dispatchEvent(new Event('input',{bubbles:true})); L('search rows='+qa('.prow').length);
  q('[data-act="cat"][data-cat="learned"]').click(); L('learned rows='+qa('.prow').length+' q kept='+(q('[data-input="search"]').value==='toilette'));
  q('[data-act="cat"][data-cat="all"]').click(); const inp2=q('[data-input="search"]'); inp2.value=''; inp2.dispatchEvent(new Event('input',{bubbles:true}));
  q('.prow').click(); L('showbig='+!!q('.showbig')); const sb=q('.showbig [data-act="close"]'); if(sb) sb.click(); L('showbig closed='+!q('.showbig'));
  // Profil
  tab('profile'); L('profile kpis='+qa('.kpi').length+' bars='+qa('.bars .b').length);
  q('[data-act="set-theme"][data-v="dark"]').click(); L('theme='+document.documentElement.dataset.theme); q('[data-act="set-theme"][data-v="auto"]').click();
  q('[data-act="lang-sheet"]').click(); L('lang sheet rows='+qa('.overlay .langrow').length); q('.overlay').click(); L('lang sheet closed='+!q('.overlay'));
  // Willkommen zurück
  window.__app.store.update(s=>{ s.days={'2026-09-01':{xp:30,vi:30}}; }); tab('home');
  L('welcome button='+!!q('[data-act="start-welcome"]'));
  runSession('[data-act="start-welcome"]', 'welcome');
  window.__app.store.update(s=>{ s.days['2026-09-20']={xp:60,vi:60}; }); tab('home');
  // Koreanisch
  q('[data-act="lang-sheet"]').click(); q('.overlay [data-act="pick"][data-code="ko"]').click(); L('switched lang='+state().activeLang+' chip='+(q('.chip .name')||{}).textContent);
  runSession('[data-act="start-lesson"][data-id="ko-u0l1"]', 'hangul1');
  runSession('[data-act="start-lesson"][data-id="ko-u0l5"]', 'hangul5');
  runSession('[data-act="start-lesson"][data-id="ko-u1l1"]', 'ko lesson');
  L('roman shown='+!!q('.rom')+' setting='+state().settings.showRoman);
  tab('practice'); runSession('[data-act="drill"]', 'hangul drill');
  tab('travel'); L('ko travel rows='+qa('.prow').length);
  q('[data-act="lang-sheet"]')||tab('home'); q('[data-act="lang-sheet"]').click(); q('.overlay [data-act="pick"][data-code="vi"]').click(); L('back to '+state().activeLang);
  const st=state(); L('state='+JSON.stringify({v:st.v,lessons:Object.keys(st.langs.vi.lessons),days:Object.keys(st.days),items:Object.keys(st.langs.vi.items).length,sessions:st.langs.vi.sessions.length,ko:st.langs.ko?Object.keys(st.langs.ko.lessons):null,pending:!!st.pending}));
} catch(e){ L('EXCEPTION '+e.message+' '+(e.stack||'').split('\n').slice(0,2).join(' | ')); }
L('errors='+JSON.stringify(window.__errors));
out(); document.title='UI-DONE';
</script></body></html>
