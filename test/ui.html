<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>UI-Test</title></head><body>
<div id="app"></div><pre id="log"></pre>
<script>window.__errors=[];window.onerror=function(m,s,l){window.__errors.push(m+' @'+l)};</script>
<script src="../data/vi.js"></script><script src="../app.js"></script>
<script>
// Klickt sich synchron durch drei Sessions: erste Lektion (Töne), zweite Lektion (Wörter), Wiederholung.
(function(){
  const log=[]; const L=m=>log.push(m);
  const q=s=>document.querySelector(s), qa=s=>Array.from(document.querySelectorAll(s));
  const out=()=>{ document.getElementById('log').textContent=log.join('\n'); };
  function runSession(startSel, label){
    const b=q(startSel); if(!b){ L(label+': START BUTTON MISSING'); return false; }
    L(label+': '+b.textContent.trim().replace(/\s+/g,' ').slice(0,60)); b.click();
    let steps=0, types={};
    try {
      while(steps<800){
        steps++;
        if(!q('.sess')){ if(q('.done')){ L('  done screen: '+q('.done h2').textContent+' '+qa('.stat .v').map(e=>e.textContent).join(' ')); q('[data-home]').click(); L('  steps='+steps+' types='+JSON.stringify(types)); return true; } L('  NO SESSION after step '+steps); return false; }
        const title=q('.qtitle')?q('.qtitle').textContent.replace(/\d+ von 6: .*/,'N von 6'):'?'; types[title]=(types[title]||0)+1;
        if(q('[data-next]')) q('[data-next]').click();
        else if(q('[data-skip]')) q('[data-skip]').click();
        else if(q('[data-tile]')) { const free=qa('[data-tile]:not(.used)'); const chk=q('[data-check]:not([disabled])'); if(free.length && (!chk || steps%3)) free[0].click(); else chk.click(); }
        else if(q('[data-opt]')) { const chk=q('[data-check]:not([disabled])'); if(!chk){ const o=qa('[data-opt]'); o[Math.floor(Math.random()*o.length)].click(); } else chk.click(); }
        else { L('  STUCK on '+title); return false; }
      }
      L('  ABORT too many steps'); return false;
    } catch(e){ L('  EXCEPTION '+e.message+' '+(e.stack||'').split('\n')[1]); return false; }
  }
  runSession('[data-start-lesson]', 'lesson1');
  runSession('[data-start-lesson="u1l1"]', 'lesson2');
  runSession('[data-start-lesson="u1l1"]', 'lesson2 repeat');
  // Wiederholung erzwingen: alle gelernten Wörter fällig machen
  try { const st=JSON.parse(localStorage.getItem('sprachpfad.v1')); Object.values(st.items).forEach(i=>i.due='2000-01-01'); localStorage.setItem('sprachpfad.v1', JSON.stringify(st)); } catch(e){ L('state edit failed '+e.message); }
  location.hash=''; // Home neu rendern über Tab
  q('[data-tab="words"]').click(); L('words rows='+qa('.wrow').length+' due='+qa('.wrow .due').length);
  q('[data-tab="more"]').click(); L('more ok='+!!q('[data-tones]'));
  q('[data-tab="home"]').click();
  L('home review button='+(q('[data-start-review]')?q('[data-start-review]').textContent.trim().replace(/\s+/g,' '):'none'));
  q('[data-tab="home"]').click();
  let st=null; try{ st=JSON.parse(localStorage.getItem('sprachpfad.v1')); }catch(e){}
  L('state='+(st?JSON.stringify({lessons:st.lessons,days:st.days,items:Object.keys(st.items).length}):'none'));
  L('errors='+JSON.stringify(window.__errors));
  out(); document.title='UI-DONE';
})();
</script></body></html>
